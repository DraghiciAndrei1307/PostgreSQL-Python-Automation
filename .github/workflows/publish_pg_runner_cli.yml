name: Publish 'pg_runner_cli' Package (PyPI & GitHub)
on:
  push:
    branches:
      - main
    paths:
      - 'pg_runner_cli/**'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get Code
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install setuptools wheel twine build
          pip install -r requirements.txt
      - name: Build 'pg_runner_cli' package
        run: |
          cd pg_runner_cli
          python -m build
      - name: Create GitHub Release for 'pg_runner_cli' package
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pg_runner_cli/dist/*.whl
            pg_runner_cli/dist/*.tar.gz
          tag_name: pg_runner_cli-v0.0.1
          name: Release of 'pg_runner_cli' v0.0.1
          body: "The official release of the pg_runner_cli_draghici_andrei package."
