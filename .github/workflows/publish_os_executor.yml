name: Publish 'os_executor' Package (PyPI & GitHub)
on:
  push:
    branches:
      - main
    paths:
      - 'os_executor/**'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Get Code
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install setuptools wheel twine build
          pip install -r requirements.txt
      - name: Build 'os_executor' package
        run: |
          cd os_executor
          python -m build
      - name: Create GitHub Release for 'os_executor' package
        uses: softprops/action-gh-release@v2
        with:
          files: |
            os_executor/dist/*.whl
            os_executor/dist/*.tar.gz
          tag_name: os_executor-v0.0.1
          name: Release of 'os_executor' v0.0.1
          body: "The official release of the os_executor_draghici_andrei package"
